name: "Warp Terminal"
description: "AI-powered terminal for Home Assistant using Warp CLI agents"
version: "2.0.3"
slug: "warp_terminal"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64
  - armv7

# External resources
url: "https://docs.warp.dev/developers/cli"

# Web interface configuration
ingress: true
ingress_port: 7681
panel_icon: mdi:robot
panel_title: "Warp Terminal"
panel_admin: true

# Port configuration
ports:
  7681/tcp: 7681
ports_description:
  7681/tcp: "Web terminal (not required for ingress)"

# Add-on configuration options
options:
  auto_launch_warp:
    name: "Auto-launch Warp Shell"
    description: "Automatically start Warp shell on terminal open (disable for interactive session picker)"
schema:
  auto_launch_warp: bool?

# Volume mapping for persistent storage
map:
  - config:rw    # Warp configuration and credentials
  - addons:rw    # Access to other add-ons for development

# Service startup configuration
startup: services

# Web UI access URL
webui: http://[HOST]:[PORT:7681]/